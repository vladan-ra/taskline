<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Task Timeline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --surface2: #f3f2f0;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a19;
    --text2: #5f5e5a;
    --text3: #9a9890;
    --radius: 8px;
    --radius-lg: 12px;
    --today: #e24b4a;

    --cat-people: #534AB7;
    --cat-admin: #185FA5;
    --cat-process: #0F6E56;
    --cat-adhoc: #D85A30;
    --cat-planning: #639922;
    --cat-ops: #BA7517;
    --cat-workflow: #993556;
    --cat-restructure: #5F5E5A;

    --p-critical: #E24B4A;
    --p-high: #EF9F27;
    --p-medium: #378ADD;
    --p-low: #888780;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --surface: #242422;
      --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0efe8;
      --text2: #b4b2a9;
      --text3: #6b6a62;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-title { font-size: 15px; font-weight: 500; flex: 1; }
  .app-title span { color: var(--text2); font-weight: 400; font-size: 13px; margin-left: 6px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent; color: var(--text);
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: 0.85; }
  .btn svg { width: 14px; height: 14px; }

  .view-toggle { display: flex; border: 0.5px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .view-toggle button {
    padding: 5px 12px; border: none; background: transparent;
    color: var(--text2); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .view-toggle button.active { background: var(--text); color: var(--bg); }

  .zoom-ctrl { display: flex; align-items: center; gap: 4px; }
  .zoom-label { font-size: 12px; color: var(--text2); min-width: 56px; text-align: center; }

  /* FILTERS BAR */
  .filters-bar {
    padding: 10px 20px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
  }
  .filter-label { font-size: 12px; color: var(--text3); margin-right: 4px; }
  .chip {
    padding: 3px 10px; border-radius: 100px;
    border: 0.5px solid var(--border-strong);
    background: transparent; color: var(--text2);
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: all 0.1s;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip:hover:not(.active) { background: var(--surface2); }

  /* MAIN LAYOUT */
  .main { display: flex; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 220px; min-width: 220px;
    border-right: 0.5px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
    position: sticky; top: 102px; max-height: calc(100vh - 102px);
  }
  .sidebar-head {
    padding: 10px 14px;
    font-size: 11px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 0.5px solid var(--border);
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .task-row {
    padding: 8px 14px;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .task-row:hover { background: var(--surface2); }
  .task-row .t-name {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 180px;
  }
  .task-row .t-meta {
    display: flex; gap: 6px; align-items: center; margin-top: 3px;
  }
  .prio-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }
  .t-due { font-size: 11px; color: var(--text3); }
  .t-due.overdue { color: var(--p-critical); font-weight: 500; }
  .t-due.soon { color: var(--p-high); }

  .cat-tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    font-weight: 500; white-space: nowrap;
  }

  /* TIMELINE AREA */
  .timeline-wrap {
    flex: 1;
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 102px);
    position: relative;
  }

  .timeline-inner {
    min-width: 100%;
    position: relative;
  }

  /* Header row with dates */
  .tl-header {
    display: flex;
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    height: 36px;
  }
  .tl-header-offset { width: 0; flex-shrink: 0; }
  .tl-date-cell {
    flex-shrink: 0;
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; justify-content: center;
    border-right: 0.5px solid var(--border);
    position: relative;
  }
  .tl-date-cell.today-col { color: var(--today); font-weight: 500; }

  /* Task bar rows */
  .tl-row {
    display: flex; align-items: center;
    height: 44px;
    border-bottom: 0.5px solid var(--border);
    position: relative;
  }
  .tl-row:hover { background: rgba(0,0,0,0.02); }

  .tl-grid-cells {
    display: flex; flex: 1;
    position: relative;
  }
  .tl-cell {
    flex-shrink: 0;
    height: 44px;
    border-right: 0.5px solid var(--border);
  }
  .tl-cell.today-col { background: rgba(226,75,74,0.04); }
  .tl-cell.weekend { background: rgba(0,0,0,0.015); }

  .tl-bar-layer {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

  .tl-bar {
    position: absolute;
    top: 9px; height: 26px;
    border-radius: 5px;
    cursor: pointer;
    pointer-events: all;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; font-weight: 500; color: white;
    overflow: hidden;
    white-space: nowrap;
    transition: opacity 0.15s, filter 0.15s;
    min-width: 6px;
  }
  .tl-bar:hover { filter: brightness(1.1); opacity: 0.95; }
  .tl-bar.overdue { outline: 2px solid var(--p-critical); outline-offset: 1px; }
  .tl-bar.due-soon::after {
    content: '';
    position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
    background: rgba(255,255,255,0.5);
    border-radius: 0 5px 5px 0;
  }

  /* Today line */
  .today-line {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--today);
    pointer-events: none; z-index: 5;
  }
  .today-line::before {
    content: 'today';
    position: absolute; top: -18px;
    left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--today);
    font-weight: 500; white-space: nowrap;
  }

  /* LIST VIEW */
  .list-view { padding: 16px 20px; display: none; }
  .list-view.active { display: block; }
  .timeline-wrap.list-mode { overflow: visible; max-height: none; }

  .list-group { margin-bottom: 24px; }
  .list-group-title {
    font-size: 11px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0 0 8px; border-bottom: 0.5px solid var(--border);
    margin-bottom: 8px;
  }
  .list-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.1s;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .list-card:hover { background: var(--surface2); }
  .list-card .lc-body { flex: 1; }
  .list-card .lc-name { font-size: 14px; font-weight: 500; }
  .list-card .lc-meta { display: flex; gap: 8px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .list-card .lc-due { font-size: 12px; color: var(--text2); }
  .list-card .lc-due.overdue { color: var(--p-critical); font-weight: 500; }
  .list-card .lc-due.soon { color: var(--p-high); }
  .list-card .lc-notes { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .prio-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    font-weight: 500;
  }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 480px;
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h2 { font-size: 15px; font-weight: 500; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 0.5px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 10px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg); color: var(--text);
    font-size: 13px; font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--text2);
  }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .btn-danger { color: var(--p-critical); border-color: var(--p-critical); }
  .btn-danger:hover { background: rgba(226,75,74,0.08); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text3); font-size: 14px;
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* LEGEND */
  .legend-bar {
    padding: 8px 20px;
    display: flex; gap: 16px; flex-wrap: wrap;
    border-top: 0.5px solid var(--border);
    background: var(--surface);
    font-size: 11px; color: var(--text3);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

  /* MOBILE */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .zoom-ctrl { display: none; }
    .app-title span { display: none; }
    .filters-bar { padding: 8px 12px; }
    .timeline-wrap { max-height: none; overflow: visible; }
    .timeline-inner { display: none; }
    .list-view { display: block !important; padding: 12px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">Strategic Timeline <span id="task-count-label"></span></div>
  <div class="view-toggle">
    <button id="btn-tl" class="active" onclick="setView('timeline')">Timeline</button>
    <button id="btn-list" onclick="setView('list')">List</button>
  </div>
  <div class="zoom-ctrl">
    <button class="btn" onclick="changeZoom(-1)">−</button>
    <span class="zoom-label" id="zoom-label">12 weeks</span>
    <button class="btn" onclick="changeZoom(1)">+</button>
  </div>
  <button class="btn primary" onclick="openModal(null)">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
    Add task
  </button>
</div>

<div class="filters-bar">
  <span class="filter-label">Priority:</span>
  <button class="chip active" data-filter-prio="all" onclick="filterPrio(this,'all')">All</button>
  <button class="chip" data-filter-prio="critical" onclick="filterPrio(this,'critical')">Critical</button>
  <button class="chip" data-filter-prio="high" onclick="filterPrio(this,'high')">High</button>
  <button class="chip" data-filter-prio="medium" onclick="filterPrio(this,'medium')">Medium</button>
  <button class="chip" data-filter-prio="low" onclick="filterPrio(this,'low')">Low</button>
  <span class="filter-label" style="margin-left:8px">Category:</span>
  <button class="chip active" data-filter-cat="all" onclick="filterCat(this,'all')">All</button>
  <button class="chip" data-filter-cat="people" onclick="filterCat(this,'people')">People</button>
  <button class="chip" data-filter-cat="admin" onclick="filterCat(this,'admin')">Admin</button>
  <button class="chip" data-filter-cat="process" onclick="filterCat(this,'process')">Process</button>
  <button class="chip" data-filter-cat="adhoc" onclick="filterCat(this,'adhoc')">Ad-hoc</button>
  <button class="chip" data-filter-cat="planning" onclick="filterCat(this,'planning')">Planning</button>
  <button class="chip" data-filter-cat="ops" onclick="filterCat(this,'ops')">Operations</button>
  <button class="chip" data-filter-cat="workflow" onclick="filterCat(this,'workflow')">Workflow</button>
  <button class="chip" data-filter-cat="restructure" onclick="filterCat(this,'restructure')">Restructuring</button>
</div>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">Tasks</div>
    <div id="sidebar-list"></div>
  </aside>

  <div class="timeline-wrap" id="timeline-wrap">
    <div class="timeline-inner" id="timeline-inner"></div>
    <div class="list-view" id="list-view"></div>
  </div>
</div>

<div class="legend-bar" id="legend-bar">
  <span style="color:var(--text2); font-weight:500; font-size:11px">Categories:</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-people)"></span>People mgmt</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-admin)"></span>Admin & comms</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-process)"></span>Process & protocol</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-adhoc)"></span>Ad-hoc problems</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-planning)"></span>Long-term planning</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-ops)"></span>Operations</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-workflow)"></span>Workflow & automation</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--cat-restructure)"></span>Restructuring</span>
  <span style="margin-left:12px; color:var(--text2); font-weight:500">Priority:</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--p-critical); border-radius:50%"></span>Critical</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--p-high); border-radius:50%"></span>High</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--p-medium); border-radius:50%"></span>Medium</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--p-low); border-radius:50%"></span>Low</span>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add task</h2>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Task name</label>
        <input type="text" id="f-name" placeholder="Describe the task..." />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <select id="f-cat">
            <option value="people">People management</option>
            <option value="admin">Admin & comms</option>
            <option value="process">Process & protocol</option>
            <option value="adhoc">Ad-hoc problem solving</option>
            <option value="planning">Long-term planning</option>
            <option value="ops">Operations</option>
            <option value="workflow">Workflow & automation</option>
            <option value="restructure">Restructuring</option>
          </select>
        </div>
        <div class="field">
          <label>Priority (impact)</label>
          <select id="f-prio">
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Start date</label>
          <input type="date" id="f-start" />
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" id="f-due" />
        </div>
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="f-notes" placeholder="Context, blockers, dependencies..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete" onclick="deleteTask()" style="display:none; margin-right:auto">Delete</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<script>
const CAT_COLORS = {
  people:'#534AB7', admin:'#185FA5', process:'#0F6E56',
  adhoc:'#D85A30', planning:'#639922', ops:'#BA7517',
  workflow:'#993556', restructure:'#5F5E5A'
};
const CAT_LABELS = {
  people:'People mgmt', admin:'Admin & comms', process:'Process & protocol',
  adhoc:'Ad-hoc', planning:'Long-term planning', ops:'Operations',
  workflow:'Workflow & auto', restructure:'Restructuring'
};
const PRIO_COLORS = { critical:'#E24B4A', high:'#EF9F27', medium:'#378ADD', low:'#888780' };
const PRIO_LABELS = { critical:'Critical', high:'High', medium:'Medium', low:'Low' };

const ZOOM_LEVELS = [
  { label:'4 weeks', days:28, colW:40 },
  { label:'8 weeks', days:56, colW:28 },
  { label:'12 weeks', days:84, colW:22 },
  { label:'6 months', days:180, colW:16 },
  { label:'1 year', days:365, colW:10 },
];
let zoomIdx = 2;
let activeView = 'timeline';
let filterPrioVal = 'all';
let filterCatVal = 'all';
let editingId = null;

function today() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function parseDate(s) {
  if(!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function fmtDate(d) {
  if(!d) return '';
  return d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
}
function toISO(d) {
  if(!d) return '';
  return d.toISOString().slice(0,10);
}
function daysUntil(d) {
  return Math.round((d - today()) / 86400000);
}

let tasks = JSON.parse(localStorage.getItem('stl-tasks') || '[]');

function saveTasks() {
  localStorage.setItem('stl-tasks', JSON.stringify(tasks));
}

function getFiltered() {
  return tasks.filter(t => {
    if(filterPrioVal !== 'all' && t.priority !== filterPrioVal) return false;
    if(filterCatVal !== 'all' && t.category !== filterCatVal) return false;
    return true;
  });
}

function dueClass(t) {
  if(!t.due) return '';
  const d = parseDate(t.due);
  const diff = daysUntil(d);
  if(diff < 0) return 'overdue';
  if(diff <= 7) return 'soon';
  return '';
}

function dueLabel(t) {
  if(!t.due) return '';
  const d = parseDate(t.due);
  const diff = daysUntil(d);
  if(diff < 0) return `Overdue by ${Math.abs(diff)}d`;
  if(diff === 0) return 'Due today';
  if(diff <= 7) return `Due in ${diff}d`;
  return `Due ${fmtDate(d)}`;
}

// SIDEBAR
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const filtered = getFiltered().sort((a,b) => {
    const po = {critical:0,high:1,medium:2,low:3};
    return (po[a.priority]||2) - (po[b.priority]||2);
  });
  document.getElementById('task-count-label').textContent = `(${filtered.length} task${filtered.length!==1?'s':''})`;
  if(!filtered.length) {
    list.innerHTML = '<div style="padding:20px 14px; font-size:13px; color:var(--text3)">No tasks match filters.</div>';
    return;
  }
  list.innerHTML = filtered.map(t => {
    const dc = dueClass(t);
    const dl = dueLabel(t);
    return `<div class="task-row" onclick="openModal('${t.id}')">
      <div class="t-name">${t.name}</div>
      <div class="t-meta">
        <span class="prio-dot" style="background:${PRIO_COLORS[t.priority]}"></span>
        <span class="cat-tag" style="background:${CAT_COLORS[t.category]}22; color:${CAT_COLORS[t.category]}">${CAT_LABELS[t.category]||t.category}</span>
        ${dl ? `<span class="t-due ${dc}">${dl}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

// TIMELINE
function renderTimeline() {
  const wrap = document.getElementById('timeline-inner');
  const zoom = ZOOM_LEVELS[zoomIdx];
  document.getElementById('zoom-label').textContent = zoom.label;

  const startD = new Date(today());
  startD.setDate(startD.getDate() - 7);
  const days = zoom.days + 14;
  const colW = zoom.colW;

  const filtered = getFiltered();

  // Build header
  let headerHTML = `<div class="tl-header">`;

  // Date cells
  for(let i = 0; i < days; i++) {
    const d = new Date(startD); d.setDate(d.getDate() + i);
    const isToday = daysUntil(d) === 0;
    const isMon = d.getDay() === 1;
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    let label = '';
    if(zoom.days <= 56) {
      if(isMon || i===0) label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    } else {
      if(d.getDate()===1 || i===0) label = d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
    }
    headerHTML += `<div class="tl-date-cell ${isToday?'today-col':''}" style="width:${colW}px; min-width:${colW}px">${label}</div>`;
  }
  headerHTML += '</div>';

  // Task rows
  let rowsHTML = '';
  if(!filtered.length) {
    rowsHTML = `<div class="empty-state"><b>No tasks yet</b><p>Click "+ Add task" to get started.</p></div>`;
  } else {
    filtered.sort((a,b) => {
      const po = {critical:0,high:1,medium:2,low:3};
      return (po[a.priority]||2) - (po[b.priority]||2);
    }).forEach(t => {
      let cellsHTML = '';
      let barsHTML = '';
      for(let i = 0; i < days; i++) {
        const d = new Date(startD); d.setDate(d.getDate() + i);
        const isToday = daysUntil(d) === 0;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        cellsHTML += `<div class="tl-cell ${isToday?'today-col':''} ${isWeekend?'weekend':''}" style="width:${colW}px; min-width:${colW}px"></div>`;
      }

      if(t.start && t.due) {
        const sd = parseDate(t.start);
        const ed = parseDate(t.due);
        const startOffset = Math.round((sd - startD) / 86400000);
        const endOffset = Math.round((ed - startD) / 86400000);
        const left = Math.max(0, startOffset) * colW;
        const right = Math.min(days, endOffset + 1) * colW;
        const width = Math.max(colW, right - left);
        const dc = dueClass(t);
        const label = width > colW * 3 ? t.name : '';
        barsHTML = `<div class="tl-bar ${dc}" style="left:${left}px; width:${width}px; background:${CAT_COLORS[t.category]}" onclick="openModal('${t.id}')" title="${t.name} — ${PRIO_LABELS[t.priority]} priority — Due ${fmtDate(ed)}">${label}</div>`;
      }

      rowsHTML += `<div class="tl-row">
        <div class="tl-grid-cells" style="position:relative">
          ${cellsHTML}
          <div class="tl-bar-layer">${barsHTML}</div>
        </div>
      </div>`;
    });
  }

  // Today line
  const todayOffset = Math.round((today() - startD) / 86400000);
  const todayLeft = todayOffset * colW + colW / 2;
  const todayLineHTML = `<div class="today-line" style="left:${todayLeft}px; top:36px; height:calc(100% - 36px)"></div>`;

  wrap.innerHTML = `<div style="position:relative; min-width:${days*colW}px">${headerHTML}${rowsHTML}${todayLineHTML}</div>`;
}

// LIST VIEW
function renderList() {
  const lv = document.getElementById('list-view');
  const filtered = getFiltered();

  if(!filtered.length) {
    lv.innerHTML = '<div class="empty-state"><b>No tasks yet</b><p>Click "+ Add task" to get started.</p></div>';
    return;
  }

  const groups = { critical:[], high:[], medium:[], low:[] };
  filtered.forEach(t => (groups[t.priority]||groups.medium).push(t));

  let html = '';
  for(const [prio, items] of Object.entries(groups)) {
    if(!items.length) continue;
    items.sort((a,b) => {
      if(!a.due && !b.due) return 0;
      if(!a.due) return 1; if(!b.due) return -1;
      return parseDate(a.due) - parseDate(b.due);
    });
    html += `<div class="list-group">
      <div class="list-group-title" style="color:${PRIO_COLORS[prio]}">${PRIO_LABELS[prio]} impact</div>
      ${items.map(t => {
        const dc = dueClass(t);
        const dl = dueLabel(t);
        return `<div class="list-card" onclick="openModal('${t.id}')">
          <span class="prio-dot" style="background:${PRIO_COLORS[t.priority]}; margin-top:4px; flex-shrink:0; width:9px; height:9px; border-radius:50%"></span>
          <div class="lc-body">
            <div class="lc-name">${t.name}</div>
            <div class="lc-meta">
              <span class="cat-tag" style="background:${CAT_COLORS[t.category]}22; color:${CAT_COLORS[t.category]}">${CAT_LABELS[t.category]||t.category}</span>
              ${dl ? `<span class="lc-due ${dc}">${dl}</span>` : ''}
            </div>
            ${t.notes ? `<div class="lc-notes">${t.notes}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  lv.innerHTML = html;
}

function render() {
  renderSidebar();
  if(activeView === 'timeline') renderTimeline();
  else renderList();
}

// VIEW TOGGLE
function setView(v) {
  activeView = v;
  document.getElementById('btn-tl').classList.toggle('active', v==='timeline');
  document.getElementById('btn-list').classList.toggle('active', v==='list');
  document.getElementById('timeline-inner').style.display = v==='timeline' ? '' : 'none';
  document.getElementById('list-view').style.display = v==='list' ? 'block' : 'none';
  render();
}

function changeZoom(dir) {
  zoomIdx = Math.max(0, Math.min(ZOOM_LEVELS.length-1, zoomIdx+dir));
  renderTimeline();
  document.getElementById('zoom-label').textContent = ZOOM_LEVELS[zoomIdx].label;
}

function filterPrio(el, val) {
  filterPrioVal = val;
  document.querySelectorAll('[data-filter-prio]').forEach(b => b.classList.toggle('active', b===el));
  render();
}
function filterCat(el, val) {
  filterCatVal = val;
  document.querySelectorAll('[data-filter-cat]').forEach(b => b.classList.toggle('active', b===el));
  render();
}

// MODAL
function openModal(id) {
  editingId = id;
  const modal = document.getElementById('modal');
  const today = toISO(new Date());
  document.getElementById('btn-delete').style.display = id ? 'inline-flex' : 'none';
  document.getElementById('modal-title').textContent = id ? 'Edit task' : 'Add task';
  if(id) {
    const t = tasks.find(x => x.id===id);
    if(!t) return;
    document.getElementById('f-name').value = t.name;
    document.getElementById('f-cat').value = t.category;
    document.getElementById('f-prio').value = t.priority;
    document.getElementById('f-start').value = t.start||'';
    document.getElementById('f-due').value = t.due||'';
    document.getElementById('f-notes').value = t.notes||'';
  } else {
    document.getElementById('f-name').value = '';
    document.getElementById('f-cat').value = 'planning';
    document.getElementById('f-prio').value = 'medium';
    document.getElementById('f-start').value = today;
    document.getElementById('f-due').value = '';
    document.getElementById('f-notes').value = '';
  }
  modal.classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}
function closeModalOnBackdrop(e) {
  if(e.target === document.getElementById('modal')) closeModal();
}

function saveTask() {
  const name = document.getElementById('f-name').value.trim();
  if(!name) { document.getElementById('f-name').focus(); return; }
  const data = {
    name,
    category: document.getElementById('f-cat').value,
    priority: document.getElementById('f-prio').value,
    start: document.getElementById('f-start').value,
    due: document.getElementById('f-due').value,
    notes: document.getElementById('f-notes').value.trim(),
  };
  if(editingId) {
    const idx = tasks.findIndex(x => x.id===editingId);
    if(idx>=0) tasks[idx] = { ...tasks[idx], ...data };
  } else {
    tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), ...data });
  }
  saveTasks(); closeModal(); render();
}

function deleteTask() {
  if(!editingId) return;
  tasks = tasks.filter(x => x.id!==editingId);
  saveTasks(); closeModal(); render();
}

// KEYBOARD
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && document.getElementById('modal').classList.contains('open')) {
    if(document.activeElement.tagName !== 'TEXTAREA') saveTask();
  }
});

render();
